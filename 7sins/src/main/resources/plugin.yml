name: 7sins
version: '${project.version}'
main: com.example.sevensins.SevenSinsPlugin
api-version: '26.2'
description: Seven custom two-phase deadly-sin boss encounters.
softdepend: [floodgate]
commands:
  7sins:
    description: Summon a deadly-sin boss or load the boss resource pack.
    usage: /7sins [spawn <wrath|pride|greed|lust|envy|gluttony|sloth>|remove|list|pack|help]
    aliases: [sevensins]
permissions:
  7sins.admin:
    description: Summon and remove 7sins bosses.
    default: op
