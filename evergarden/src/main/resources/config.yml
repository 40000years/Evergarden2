# Evergarden — Twilight Gardens / Advance Magic
config-version: 2
dimension:
  world-name: evergarden
  seed: 72819345
  # ขอบเขตมิติ Evergarden (WorldBorder)
  # - 500000 = เส้นผ่านศูนย์กลาง 500,000 บล็อก (เดินทางได้ถึงพิกัด ±250,000)
  # - 1000000 = เส้นผ่านศูนย์กลาง 1,000,000 บล็อก (เดินทางได้ถึงพิกัด ±500,000 ตามที่ต้องการ)
  border-size: 1000000
  # Fixed twilight: light gardens, dark sky, visible stars.
  time: 13000
structures:
  observatory:
    enabled: true
  hanging-garden:
    enabled: true
  world-boss-temple:
    enabled: true
    # Ancient 241x241 temple with a clear 161-block combat arena; boss not added yet.
    # Garden-style independent rarity roll; null inherits the Garden sky grid/rate.
    spacing-chunks: null
    chance: null
    # Placement is persisted in world-layout.yml; only unexplored cells receive it.
    # Creative admins may maintain the structure; all other edits are blocked.
  # Whale, observatory and hanging garden each roll the chance below.
  # Shared one-time chest rewards; weights are relative, one bonus is drawn.
  treasure:
    flying-staff-rate-version: 2
    # One roll per structure, at most one staff across both chests; never craftable.
    flying-staff-chances:
      whale: 0.10
      hanging-garden: 0.075
      observatory: 0.075
    second-chest-chance: 0.30
    crop-stacks: 2
    tier-three-chance: 0.75
    seed-chance: 0.35
    bonus-weights:
      key-shard: 300
      astral-dust: 150
      nether-star: 30
      limit-break: 15
      unique-scroll: 5
      none: 500
  sky-whale:
    enabled: true
    # Each kind has one candidate per 32x32 chunk cell (512x512 blocks).
    # Historical rates used before the restoration update. Do not rewrite old layouts.
    # New cells use restoration.unexplored-chance after the one-time v3 migration.
    spacing-chunks: 32
    chance: 0.01
    unexplored-chance: 0.01
  restoration:
    # Initial migration values are persisted in world-layout.yml for seed stability.
    unexplored-chance: 0.03
    altar-chance: 0.60
    # Exactly one Restoration Core per new structure; this is the additional wand roll.
    repair-wand-chance: 0.10
  spacing-chunks: 18
  chance: 0.85
  minor:
    reset-hours: 2
performance:
  max-active-dungeons: 6
  max-dungeon-mobs: 64
  max-special-projectiles: 64
  idle-reset-seconds: 60
portal:
  # Build a Nether Portal shape from Block of Quartz, then throw any flower into the empty frame.
  entry-worlds: [world, world_nether, world_the_end]
spawn-protection:
  # ป้องกันพื้นที่เกาะเกิด (Spawn Island) และบริเวณประตูมิติใน Evergarden
  # ผู้เล่นทั่วไปจะไม่สามารถขุด วางบล็อก เทหรือตักของเหลวบนเกาะหลักได้ (แอดมินใน Creative สามารถทำได้ปกติ)
  enabled: true
  # รัศมีการคุ้มครองรอบจุดศูนย์กลาง (0, 0) ครอบคลุมทั้งเกาะหลัก ประตูมิติ และลานเกิด (ค่าเริ่มต้น: 80 บล็อก)
  radius: 80
combat:
  # Optional Weakness I from guardians/casters. Off so low-damage melee remains usable.
  apply-weakness: false
  # Five guardian waves, followed by one boss. Range 2-12.
  waves: 5
  custom-appearance: true
  boss-skill-damage: 35
  boss-health: 1024
  guardian-health: 90
  specialist-health: 80
  boss-attack: 27
  guardian-attack: 16
  caster-interval-ms: 7000
  boss-skill-interval-ms: 5500
  # Preserve the 2.2-second warning; increase the configured base damage by 10%.
  boss-skill-power-percent: 110
  # Cobwebs are intentionally rare and cannot retrigger repeatedly on the same player.
  cobweb-chance: 0.05
  cobweb-cooldown-ms: 8000
  true-death:
    # จำนวนครั้งที่บอสโจมตีโดนผู้เล่นเพื่อเลื่อนระดับคำสาปขึ้น 1 ขั้น
    hits-per-level: 10
    # ระดับคำสาปสูงสุดที่จะ 'บังคับตาย (True Death ทะลวง Totem 100%)' ทันที
    max-level: 5
    # ดาเมจคลื่นคำสาปต่อเลเวลเมื่อเลื่อนขั้นระดับ 1 ถึง 4 (ไม่บังคับตาย · Totem ช่วยชีวิตได้หากเลือดหมด)
    pulse-damage-per-level: 4.0
world-boss:
  enabled: true
  visuals:
    pack:
      enabled: true
      # Separate bundled addon; keep the existing relic pack/CDN intact.
      # Leave empty to serve judge-java.zip automatically; an external URL must host these exact bytes.
      url: ''
      host:
        bind: 0.0.0.0
        port: 8189
        public-host: ''
        # Optional HTTPS reverse proxy base, followed by /evergarden/<sha1>.zip.
        public-url: ''
  # Virtual solo HP, separately scaled from LevelledMobs. No automatic DPS adaptation.
  # Upgrade the former 40,000 default once; custom HP values remain configurable.
  balance-version: 2
  core-health: 20000
  hand-health: 8500
  health-per-extra-player: 0.65
  max-participants: 16
  max-active: 2
  exposure-seconds: 12
  # A core opening gives 3 seconds to approach, then ordinary attacks resume while it stays open.
  # Phase pressure: 1/2/3-pulse combos, wider areas, and 2.4/1.8/1.4-second recovery gaps.
  # Spell damage pierces armor/enchantments; resistance, absorption and life-saving effects still work.
  # Base hits use this max HP fraction. Sky beams add 15%, capped at 80% before power.
  # All red-circle spells gain 30% after those base ceilings and before defenses.
  attack-damage: 56
  attack-max-health-fraction: 0.70
  attack-power-percent: 130
  # Final damage after all weapon bonuses, shared across hands/core/summons per player.
  damage-caps:
    melee: 100
    projectile: 80
    magic: 240
    other: 80
    per-player-per-second: 240
  # Phase 2 only. First judgment 12 seconds after transition, then at least 130 seconds apart.
  judgment-phase-two-delay-seconds: 12
  # 8 seconds to reach a green sanctuary. Death outside bypasses Totem/Phoenix/Soul Ward.
  judgment-warning-seconds: 8
  judgment-cooldown-seconds: 130
  sanctuary-radius: 16
  # Give defeated/disconnected players three minutes to return before resetting.
  empty-reset-seconds: 180
  # 0 disables the hard time limit; an active fight continues until victory.
  # A positive value is an optional admin limit, shown on the boss bar.
  fight-timeout-seconds: 0
  respawn-seconds: 14400
  rewards:
    # Every player who damaged a hand or the core also receives one random core
    # from all 18 Advance Magic types (including Solar, Chronos and other Mythics).
    # The roll is stored for dead/offline players and when their inventory is full.
    keys: 2
    experience: 1500
rewards:
  # Vault Loot Table Percentages:
  # One reward per vault; rates are defined in VaultLootTable.
  # 58.5% Consumables and reagents, 1.5% Flying Staff
  # 15% Limit Break Scroll, 12% Unique Enchant Scroll
  # 7% Advance Magic Core (14 normal types, equal chance)
  # 5% Special Relic Equipment
  # 0.5% Mythic Core total: Levitation / Solar Apocalypse / Chronos: Final Hour / Heaven's Judgment
  # Four equally likely Mythic cores: 0.125% each per vault. Scroll of Eternity: 0.5%.
  # Core total: 7.5%. These comments document VaultLootTable, not configurable weights.
relics:
  allow-pvp: false
resource-pack:
  enabled: true
  # Pinned to the published pack with the redesigned Mythic cores. Private CDN URLs are preserved.
  url: 'https://raw.githubusercontent.com/40000years/Evergarden2/0e6a864979528b50e00e48baa98e267993803ba4/evergarden/dist/evergarden-java.zip'
  sha1: '764b727583b67d39a9445ce5bb99fc243f16d683'
  required: false
  host:
    enabled: false
    bind: 0.0.0.0
    port: 8188
    public-host: ''
    public-url: ''
  geyser:
    auto-install: true

# No anticheat bypass permissions are granted. Restart after changing modes.
compatibility:
  # Keep LevelledMobs active elsewhere, but automatically exclude the Evergarden world.
  levelled-mobs-exclude-world: true
  # Offer the official Java 26.x food pack when AeternumSeasons is enabled.
  # Bedrock pack + mappings are installed before local Geyser starts when Aeternum is present.
  aeternum-seasons:
    bedrock:
      # Installs missing official files, preserves existing files, and enables Geyser custom content.
      auto-install: true
    resource-pack:
      enabled: true
      # Verified GitHub mirror; clients do not need access to the Modrinth CDN.
      url: https://raw.githubusercontent.com/40000years/Evergarden2/2408a45/evergarden/dist/Aeternum-Foods-26.x.zip
      sha1: f7137350c381dfb933f96e869bfaced4a292bcff
  # vanilla: Fairy/Bamboo use Jump Boost; no flight toggles or step-height changes.
  # enhanced: opt-in Double Jump and a temporary step-height modifier; test your anticheat first.
  # Glider always uses vanilla Slow Falling while sneaking, in either mode.
  crop-movement: vanilla
  # Capped server-sent grapple/knockback. Set false to disable these player impulses.
  player-impulses: true
  max-impulse-horizontal: 1.2
  max-impulse-vertical: 1.0
