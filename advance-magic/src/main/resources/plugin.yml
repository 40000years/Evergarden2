name: advance-magic
version: 1.1.1-restoration-art
main: com.example.advancemagic.AdvanceMagicPlugin
api-version: '26.2'
description: Fifteen server-side spells, mana and craftable wands.
softdepend: [floodgate]
loadbefore: [Geyser-Spigot]
commands:
  magic:
    description: List spells, craft wands or open the admin item menu.
    usage: /magic [list|mana|craft|items|pack [resend]|give <player> <spell>]
permissions:
  advance-magic.cast:
    default: true
  advance-magic.craft:
    default: true
  advance-magic.admin:
    default: op
