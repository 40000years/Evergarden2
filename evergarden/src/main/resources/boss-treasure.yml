# Boss structure treasure: 8 decorated chests per structure. Restart after editing.
# End City 26.2 is the baseline; equipment levels deliberately exceed vanilla ceilings.
# Chance is 0..1. Weights are relative within each pool. Incompatible enchants are excluded.
mechanics:
  # Only transfer a boss enchant's awarded level. Equal levels never grow beyond it.
  anvil-transfer: true
  # For each boss EPF point beyond native EPF 20, reduce the remaining damage by 4%.
  protection-extra-point-reduction: 0.04
  # Native water movement efficiency saturates at Depth Strider III.
  depth-strider-extra-level-speed: 0.10
  # Preserve the small movement overflow when Swift Sneak V reaches the attribute ceiling.
  swift-sneak-overflow: true
