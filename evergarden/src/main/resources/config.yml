# Evergarden — Twilight Gardens / Advance Magic
config-version: 2
overworld-sanctuaries:
  enabled: true
  bosses:
    enabled: true
  search-max-cells: 128
  habitat:
    clear-stray-leaves: true
    suppress-natural-hostiles: true
    guard-spawners: true
  treasure:
    # Per eligible equipment item. One existing multi-level enchant becomes vanilla cap + 1.
    over-cap-chance: 0.15
  # Empty = ordinary vanilla Overworlds only; custom generators are excluded.
  worlds: []
  # Saved per world UUID on first installation; later config edits do not move sites.
  spacing-chunks: 64
  chance: 0.65
  # Fresh cells: each kind has its own grid of regions N x N cells (N = 2-8) and at most one sanctuary per region,
  # clear of vanilla villages and outposts. Smaller N = more of that kind. About 3-5 of each per 15000 x 15000 blocks.
  # Saved per world on first start; cells that already had terrain keep the one-roll placement above.
  region-cells:
    acheron: 5
    phlegethon: 2
    cocytus: 6
    banshee: 6
    malefeasance: 7
    styx: 7
arkhaia:
  # Game ticks an altar rests after a victory (24000 = one Minecraft day, ~20 minutes).
  # Each summon also consumes the held Netherite Block (Creative excepted).
  respawn-ticks: 24000
  model-engine:
    # Java uses Model Engine; Bedrock uses the native Geyser rig when available.
    enabled: true
  combat:
    # Solo health; each extra participant adds health-per-extra-player, never above health-cap.
    health: 7000.0
    health-per-extra-player: 1500.0
    health-cap: 10000.0
    # Scales every Arkhaia attack (100 = the published tuning). Hits pierce armor like the sanctuary bosses.
    damage-percent: 100
    # A wiped party restarts the current phase after 10 seconds; the arena closes after this grace.
    return-grace-seconds: 180
# Phase three of Arkhaia, Seraphon, the Ancient Judge, the Dragon Nest dragons (enraged) and the four realm bosses.
#  adaptation: Phlegethon's weapon adaptation. Another weapon family resets it and lands in full; one chain per
#    boss, shared by the whole party.
#      full = each repeated hit from the same family halves the previous one (10, 5, 2.5 ...), like Phlegethon
#      half = repeated hits stop at 50% (Phlegethon's ritual rule) · off = no adaptation
#    The Judge uses half: its final phase already accepts melee weapons only.
#  damage-multiplier: the boss's own attacks deal this many times their normal damage in phase three.
#    The Judge's red spells already take 55-90% of max health, so x2 makes every phase-three hit lethal
#    without a Totem, Resistance or absorption.
boss-phase-three:
  adaptation:
    arkhaia: full
    seraphon: full
    judge: half
    dragons: full
    realm: full
  damage-multiplier:
    arkhaia: 2.0
    seraphon: 2.0
    judge: 2.0
    dragons: 2.0
    realm: 2.0
  # Blows sized by the victim's max HP (Arkhaia sweeps/Execute, Seraphon solar beam/radiant burst, the Judge's red
  # spells) are multiplied only up to this share of max HP, so a full-health player survives one; never weaker
  # than outside phase three. 0 = multiply them plainly (a doubled 55% sweep then kills from full health).
  percent-blow-cap: 0.95
dragon-bosses:
  # Resident elemental dragons guarding the three Dragon Nests in Evergarden (docs/dragon-hunt.md).
  enabled: true
  # A resting dragon wakes when a player comes this close to its nest (or strikes it).
  aggro-radius: 56.0
  # The hunt: the dragon flies after every player within chase-radius blocks of ITSELF, anywhere up to
  # max-roam blocks from its nest, and never flies past max-roam. To escape, out-fly it beyond chase-radius
  # or get past max-roam from the nest (warping counts). It then flies home slowly (untouchable) and is restored.
  # Speeds are blocks per tick: hovering/close fight, sprint after prey farther than 48 blocks, walking in the
  # nest, and the slow flight home. (The old leash-radius / fly-speed / return-speed keys are no longer read.)
  hunt:
    chase-radius: 300.0
    max-roam: 1000.0
    fly-speed: 1.05
    chase-speed: 1.6
    walk-speed: 0.42
    return-speed: 0.6
  # Health is rolled between these each time a dragon spawns (per-element health-min/max override them).
  health-min: 13000.0
  health-max: 15000.0
  # Extra health per additional hunter (0 = off, health stays within the roll); capped by health-cap.
  party-health-per-player: 0.0
  health-cap: 60000.0
  # Scales every dragon attack (100 = the published tuning).
  damage-percent: 100.0
  # Share of each hit that lands as a sonic rend ignoring armor and Protection (100 = published tuning).
  rend-percent: 100.0
  respawn-seconds: 1800
  fire:
    enabled: true
  storm:
    enabled: true
  ice:
    enabled: true
dimension:
  world-name: evergarden
  seed: 72819345
  # ขอบเขตมิติ Evergarden (WorldBorder)
  # - 500000 = เส้นผ่านศูนย์กลาง 500,000 บล็อก (เดินทางได้ถึงพิกัด ±250,000)
  # - 1000000 = เส้นผ่านศูนย์กลาง 1,000,000 บล็อก (เดินทางได้ถึงพิกัด ±500,000 ตามที่ต้องการ)
  border-size: 1000000
  # Fixed twilight: light gardens, dark sky, visible stars.
  time: 13000
  terrain:
    # Four continental skyland biomes: gardens, glacier, ancient-forest, lunar-city.
    # Typical region scale in blocks; warped borders vary the actual size and shape.
    # Frozen into world-layout.yml on first upgrade. Later config edits do not move biomes.
    # Existing region files keep the original generator with a 192-block transition outside.
    biome-size: 2048
structures:
  exploration:
    # Three small and five medium destinations per biome (32 designs total).
    # Small: 2-3 chests. Medium: 5-6 chests and 50% more supplies; identical loot quality.
    # One candidate per 256-block cell; terrain and large-structure checks reduce this rate.
    # Initial chance is frozen in world-layout.yml. Restart after toggling generation.
    enabled: true
    chance: 0.35
    # Each chest guarantees food, building blocks and useful supplies. Equipment stops at iron tier.
    gear-chance: 0.65
    # Of awarded equipment, 4% has one compatible enchant 1-2 levels above the vanilla cap.
    # Other equipment uses normal Minecraft enchantments. Existing chests never refill.
    rare-enchant-chance: 0.04
    golden-apple-chance: 0.07
    enchanted-apple-chance: 0.0025
  observatory:
    enabled: true
  hanging-garden:
    enabled: true
  boss-structures:
    # Boss structures and treasure; Arkhaia also has a summonable encounter.
    # Same independent seed rolls as whale/garden/observatory, per kind per sky cell.
    # null inherits the saved sky grid and its unexplored rarity (normally 32 / 0.03).
    spacing-chunks: null
    # Empty space between building reservations, including existing structures.
    minimum-gap: 64
    # Grid, chances, gap and explored exclusions are persisted in world-layout.yml.
    # Restart after enabling/disabling a kind; existing world placement stays stable.
    arkhaia-castle:
      enabled: true
      chance: null
      traps:
        enabled: true
        # Ward plates in the side passage; normal damage, 2-second cooldown per player.
        damage: 4.0
    seraphon-valkyrie:
      enabled: true
      chance: null
    seraphon-sanctum:
      enabled: true
      chance: null
  dragon-nests:
    # Colossal 233x233 elemental Dragon Nests (109-block clear open-sky basin for scale 5.5 dragons).
    # Slightly rarer than ordinary boss structures (0.018 per sky cell vs 0.03).
    spacing-chunks: null
    minimum-gap: 72
    dragon-nest-fire:
      enabled: true
      chance: 0.018
    dragon-nest-storm:
      enabled: true
      chance: 0.018
    dragon-nest-ice:
      enabled: true
      chance: 0.018
  world-boss-temple:
    enabled: true
    # Ancient 241x241 temple with a clear 161-block combat arena; boss not added yet.
    # Garden-style independent rarity roll; null inherits the Garden sky grid/rate.
    spacing-chunks: null
    chance: null
    # Placement is persisted in world-layout.yml; only unexplored cells receive it.
    # Creative admins may maintain the structure; all other edits are blocked.
  # Whale, observatory and hanging garden each roll the chance below.
  # Shared one-time chest rewards; weights are relative, one bonus is drawn.
  treasure:
    flying-staff-rate-version: 2
    # One roll per structure, at most one staff across both chests; never craftable.
    flying-staff-chances:
      whale: 0.10
      hanging-garden: 0.075
      observatory: 0.075
      arkhaia-castle: 0.075
      seraphon-valkyrie: 0.075
      seraphon-sanctum: 0.075
      dragon-nest-fire: 0.10
      dragon-nest-storm: 0.10
      dragon-nest-ice: 0.10
    second-chest-chance: 0.30
    bonus-weights:
      echo-shard: 300
      nether-star: 30
      limit-break: 15
      unique-scroll: 5
      none: 650
  sky-whale:
    enabled: true
    # Each kind has one candidate per 32x32 chunk cell (512x512 blocks).
    # Historical rates used before the restoration update. Do not rewrite old layouts.
    # New cells use restoration.unexplored-chance after the one-time v3 migration.
    spacing-chunks: 32
    chance: 0.01
    unexplored-chance: 0.01
  restoration:
    # Initial migration values are persisted in world-layout.yml for seed stability.
    unexplored-chance: 0.03
    altar-chance: 0.60
    # Exactly one Restoration Core per new structure; this is the additional wand roll.
    repair-wand-chance: 0.10
  spacing-chunks: 18
  chance: 0.85
  minor:
    reset-hours: 2
performance:
  max-active-dungeons: 6
  max-dungeon-mobs: 64
  idle-reset-seconds: 60
portal:
  # Build a Nether Portal shape from Block of Quartz, then throw any flower into the empty frame.
  entry-worlds: [world, world_nether, world_the_end]
spawn-protection:
  # ป้องกันพื้นที่เกาะเกิด (Spawn Island) และบริเวณประตูมิติใน Evergarden
  # ผู้เล่นทั่วไปจะไม่สามารถขุด วางบล็อก เทหรือตักของเหลวบนเกาะหลักได้ (แอดมินใน Creative สามารถทำได้ปกติ)
  enabled: true
  # รัศมีการคุ้มครองรอบจุดศูนย์กลาง (0, 0) ครอบคลุมทั้งเกาะหลัก ประตูมิติ และลานเกิด (ค่าเริ่มต้น: 80 บล็อก)
  radius: 80
combat:
  # Optional Weakness I from guardians/casters. Off so low-damage melee remains usable.
  apply-weakness: false
  # Five guardian waves, followed by one boss. Range 2-12.
  waves: 5
  custom-appearance: true
  boss-skill-damage: 35
  boss-health: 1024
  guardian-health: 90
  specialist-health: 80
  boss-attack: 27
  guardian-attack: 16
  caster-interval-ms: 7000
  boss-skill-interval-ms: 5500
  # Preserve the 2.2-second warning; increase the configured base damage by 10%.
  boss-skill-power-percent: 110
  # Cobwebs are intentionally rare and cannot retrigger repeatedly on the same player.
  cobweb-chance: 0.05
  cobweb-cooldown-ms: 8000
  true-death:
    # จำนวนครั้งที่บอสโจมตีโดนผู้เล่นเพื่อเลื่อนระดับคำสาปขึ้น 1 ขั้น
    hits-per-level: 10
    # ระดับคำสาปสูงสุดที่จะ 'บังคับตาย (True Death ทะลวง Totem 100%)' ทันที
    max-level: 5
    # ดาเมจคลื่นคำสาปต่อเลเวลเมื่อเลื่อนขั้นระดับ 1 ถึง 4 (ไม่บังคับตาย · Totem ช่วยชีวิตได้หากเลือดหมด)
    pulse-damage-per-level: 4.0
world-boss:
  enabled: true
  visuals:
    pack:
      enabled: true
      required: false
      # Separate bundled addon; keep the existing relic pack/CDN intact.
      # This pack shares the resource-pack.host listener below (the Minecraft port by default).
      # Leave empty to serve the current Judge/ModelEngine ZIP automatically.
      url: ''
      host:
        public-host: ''
        # Optional HTTP(S) base override; otherwise resource-pack.host.public-url is used.
        public-url: ''
    # Build the boss/dragon rigs with ModelEngine's whole-rotation cube format (26.x clients) while ModelEngine
    # imports, without editing plugins/ModelEngine/config.yml. The dragons' 22,000 freely rotated cubes then stay one
    # model file per bone instead of ~22,300 split files: rebuild ~40 s -> ~15 s, boss pack 27 MB -> 17 MB, and the
    # client loads ~1,500 model files instead of ~22,300. Only applied in memory during each import; false = old format.
    compact-model-rotation: true
  # Virtual solo HP, separately scaled from LevelledMobs. No automatic DPS adaptation.
  # Upgrade previous published HP defaults once; preserve administrator tuning.
  balance-version: 4
  core-health: 10000
  hand-health: 1500
  health-per-extra-player: 0.65
  max-participants: 16
  max-active: 2
  exposure-seconds: 12
  # A core opening gives 3 seconds to approach, then ordinary attacks resume while it stays open.
  # Phase pressure: 1/2/3-pulse combos, wider areas, and 3.4/2.8/2.4-second recovery gaps.
  # Spell damage pierces armor/enchantments; resistance, absorption and life-saving effects still work.
  # Base hits use this max HP fraction. Sky beams add 15%, capped at 80% before power.
  # All red-circle spells gain 30% after those base ceilings and before defenses.
  attack-damage: 56
  attack-max-health-fraction: 0.70
  attack-power-percent: 130
  # No incoming damage caps. Phase 2 blocks projectiles; phase 3 also blocks wand magic.
  # Judgment remains forced death in every phase. Phase 1: first at 40s, then 230-250s.
  judgment-phase-one-delay-seconds: 40
  # Phases 2/3: first at 12s/20s after transition, then 115-135s after the last charge.
  judgment-phase-two-delay-seconds: 12
  judgment-phase-three-delay-seconds: 20
  # 8 seconds to reach a green sanctuary. Death outside bypasses Totem/Phoenix.
  judgment-warning-seconds: 8
  judgment-cooldown-seconds: 115
  sanctuary-radius: 16
  # Give defeated/disconnected players three minutes to return before resetting.
  empty-reset-seconds: 180
  # 0 disables the hard time limit; an active fight continues until victory.
  # A positive value is an optional admin limit, shown on the boss bar.
  fight-timeout-seconds: 0
  respawn-seconds: 14400
  rewards:
    # Every player credited with positive hand/core damage receives Tier V Vault keys
    # PLUS one guaranteed random LEGENDARY elemental spell scroll (equal chances).
    # Spell IDs are stored at victory; offline/dead/full-inventory players claim later.
    # If Advance Magic is unavailable, the whole pair waits and its roll is saved once ready.
    # Existing queued legacy keys/cores remain claimable. Test fights give no rewards.
    keys: 2
    experience: 1500
rewards:
  # Vaults give one primary reward; mana potions are not in the Vault pool.
  # T1..5 primary gear: 65/63/60/57/53%; books: 30/31/32/33/34%.
  # After primary gear/book only, T2..5 have a 10/15/20/25% chance of one more gear/book.
  # The extra item is 65% gear / 35% book. At most two items, each amount one.
  # Gear/book profiles and enchant levels come from boss-treasure.yml equipment.entries.
  # Generated gear/books have exactly one native enchant; gear must exceed its vanilla max.
  # Rare weapons, relic tools and staffs occupy primary slots; they are not bonus rolls.
staff-loot:
  enabled: true
  # One random APPRENTICE staff, three empty spell slots; all eight elements equally likely.
  # Legacy setting; not used by tiered Vaults. Primary staff odds T1..5: 0/.2/.5/.8/1.2%.
  vault-chance: 0.10
  # Per newly authored chest, only Whale / Hanging Garden / Observatory in Evergarden.
  sky-chest-chance: 0.03
  # Per new Evergarden structure chest in a NORMAL world, excluding Evergarden itself.
  overworld-chest-chance: 0.01
  # Existing awarded/looted chests never receive a retroactive roll.
relics:
  allow-pvp: false
resource-pack:
  enabled: true
  # Empty URL/SHA-1 serves the exact pack embedded in this JAR.
  # Administrator CDN URLs and their hashes are preserved during upgrades.
  url: ''
  sha1: ''
  required: false
  # Warn if a Java pack is still loading after this many seconds. Players can continue playing.
  required-timeout-seconds: 600
  # Public copies of the packs, named by a fingerprint of their contents. At startup the
  # server downloads each copy once and offers it only if it holds exactly the same files;
  # players then fetch it there first, with this server's own host as the fallback.
  # Outbound HTTPS is enough, so this works on hosts that expose only the game port.
  # [] = serve the packs only from this server.
  mirrors:
  - https://raw.githubusercontent.com/40000years/Evergarden2/packs/{pack}/{fingerprint}.zip
  host:
    enabled: true
    # Serve the Java packs through the Minecraft port itself, so hosting panels
    # need no extra port. false = listen on the separate port below instead.
    use-server-port: true
    bind: 0.0.0.0
    # Shared by the Evergarden and Judge/ModelEngine Java packs when use-server-port is false.
    port: 8188
    public-host: ''
    # Optional HTTP(S) reverse-proxy base URL for the separate port (also turns off use-server-port).
    public-url: ''
  geyser:
    auto-install: true

# ModelEngine Java Edition model previews, only for operators / evergarden.admin.
# Includes 17 pets with separate baby, medium and adult blueprints (51 total).
# /evergarden pets list | spawn <id> <baby|medium|adult> | gallery <stage>
# /evergarden pets growth <id> compares the three growth stages together.
# /evergarden pets animate <idle|walk|fly|sit|greet> | clear
# Preview entities never save to disk; owned companions are stored separately.
pets:
  rare:
    # Fraction of non-mythical encounters that use the seventeen rare species.
    # The habitat and recent-encounter variety weights apply within each tier.
    chance: 0.08
  wild-spawns:
    enabled: true
    # Independent custom encounters; ordinary monster spawning stays disabled.
    # Mythical pets may replace a successful ordinary encounter in their own habitat.
    attempt-interval-seconds: 45
    chance-per-player: 0.12
    stage-weights:
      baby: 45
      medium: 38
      adult: 17
    max-active-world: 16
    max-nearby-player: 2
    nearby-radius: 96
    min-player-distance: 24
    max-player-distance: 48
    min-spacing: 48
    # Candidate ground points tried per successful roll. The footprint now matches
    # the pet's real size (1x1 baby, 3x3 medium/adult, 2 blocks of headroom).
    spot-attempts: 24
    # After this many game minutes in Evergarden without an encounter, the next roll always passes.
    guarantee-minutes: 8
    # A chime marks each new encounter, and the player it appeared for sees roughly which way to look.
    # Species favour their home regions (gardens, glacier, ancient forest, lunar city) three to one.
    announce: true
    spawn-island-radius: 128
    lifetime-seconds: 900
    despawn-distance: 160
  # Per-viewer culling: each player receives data only for their own companion plus the
  # nearest few others. Hidden pets cost that player nothing, so crowds stay light.
  view:
    max-others: 6
    show-distance: 56
    hide-distance: 64
  stable:
    slots: 6
    # Permanent slots for each unique pet this owner raised from baby to adult.
    raised-adult-slots: 2
    # 0 = no limit on earned slots; the stable and breeding menus have multiple pages.
    max-slots: 0
  mythical:
    # Per species, per successful wild encounter in its habitat (2%, not per 45-second attempt).
    # All five have equal odds at every time and in all weather.
    # At most one wild mythical can be present in the world at once.
    chance: 0.02
    spawn-rate-version: 3
    # Guaranteed any eligible species on this many eligible successful encounters; 0 disables.
    pity-encounters: 0
    lifetime-seconds: 1200
    trust-multiplier: 0.5
    stage-weights:
      baby: 80
      medium: 17
      adult: 3
  riding:
    enabled: true
    adult-only: true
    # Mythical adults only. Fenrir runs/jumps; the other four fly. No mana or item uses.
    horizontal-speed: 0.486
    vertical-speed: 0.288
    sprint-multiplier: 1.5
    fenrir:
      horizontal-speed: 0.7
      jump-velocity: 1.0
    aetherius:
      # Two absorption hearts, once per 120 seconds; boarding again never refills them.
      absorption-cooldown-seconds: 120
    # Rider feet above the pet model origin; size variations are applied automatically.
    seat-height:
      aetherius: 2.10
      ignis_draconis: 2.15
      zephyros: 1.98
      solaris: 1.72
      fenrir: 1.62
    anticheat:
      bypass-permissions:
        GrimAC: [grim.disabled]
        NoCheatPlus: [nocheatplus.checks.moving.vehicle]
  companions:
    # Worlds where companions never appear, e.g. [world_nether]
    disabled-worlds: []
    # Companions step away while a boss fight is this close and return afterwards.
    boss-radius: 40
    feed-cooldown-seconds: 60
    feed-growth: 5
    boss-growth: 20
    # Modes (/pet mode follow|stay|perch|assist). A pet on stay follows again past this distance.
    stay-leash: 64
    # Assist: foes within this many blocks of the owner; a foe hits back on this % of bites.
    assist-radius: 16
    counter-chance: 35
    # A knocked-out pet rests this many game ticks (6000 = five minutes at 20 TPS).
    faint-ticks: 6000
    recovery-version: 2
  # Growth points: +1 per minute out with an active owner, plus feeding and boss victories.
  growth:
    medium: 120
    adult: 360
  taming:
    feed-cooldown-ms: 2500
    # Favourite foods; any item name, e.g. frost_wyvern: COD
    food: {}
  breeding:
    nest-minutes: 30
    cooldown-hours: 24
    mythical-cooldown-hours: 72
    food-cost: 8
    bond-required: 50
    eggs-per-day: 2
    incubate-minutes: 20
  model-preview:
    enabled: true
    # Keep all 111 editable files in Evergarden/modelengine/pets/library by default.
    # Import only chosen species (all three growth forms), then restart the server.
    # This preserves ModelEngine slots for boss models and the required internal_fire.
    install-species: []
    # Opt in only with unrestricted ModelEngine; imports the entire 111-model collection.
    install-all-models: false
    lifetime-seconds: 600
    max-per-admin: 18
    max-distance: 96

# The Seraph at the Evergarden spawn: a villager-style exchange paid mostly in Seraph Feathers,
# with Soul Orbs from the six sanctuary bosses as the special ingredient for higher goods.
# /evergarden seraph here moves her (saved in seraph-trader.yml, which overrides x/y/z/yaw).
seraph-trader:
  enabled: true
  x: 7.5
  y: 97
  z: 0.5
  yaw: 90
  label-height: 4.6
  feathers:
    # Repeatable sources (sanctuary bosses, wild pets) stop at this many per player per day.
    daily-cap: 60
    sanctuary-boss: 5        # each contributing player, capped
    world-boss: 15           # Bodiless Judge and Arkhaia, not capped
    first-tame: 5            # first tame of each species, once ever
    first-hatch: 5           # first hatch of each species, once ever
    wild-feed-chance: 0.2    # a fed wild pet drops 1 feather, capped
    blessing: 5              # first visit to the Seraph each day
    # Structure chests: exploration 1-2, landmarks 2-3, boss structures and sanctuaries 3-5, once per chest.
    chest-loot: true
  # Ingredient amounts (max 64 per slot). 1 golden feather = 10 feathers in the exchange.
  prices:
    staff-feathers: 40
    mythical-egg-cores: 2      # cores of one realm boss per baby mythical egg
    # Dragon armor from Dragon Nest scales (scales of the matching dragon + Golden Seraph Feathers per piece).
    # A full set: 42 scales and 19 golden feathers. A hunter earns 1 scale for 3%+ of the damage, 2 from 12%,
    # +1 for the top damage dealer.
    dragon-armor-scales-helm: 8
    dragon-armor-golden-helm: 4
    dragon-armor-scales-chestplate: 14
    dragon-armor-golden-chestplate: 6
    dragon-armor-scales-leggings: 12
    dragon-armor-golden-leggings: 5
    dragon-armor-scales-boots: 8
    dragon-armor-golden-boots: 4
    staff-orbs: 7              # Soul Orbs in the element's colour (element-orbs below)
    special-staff-feathers: 60 # Light and Dark
    special-staff-orbs: 9
    scroll-basic-feathers: 8
    scroll-rare-feathers: 15
    scroll-epic-feathers: 30
    good-potion-feathers: 1
    supreme-potion-feathers: 12
    legend-core-golden: 15     # golden feathers
    legend-core-orbs: 3        # orbs of any one sanctuary
    legendary-weapon-cores: 3  # Excalibur, Longinus, Tyrfing, Mjolnir, Vajra
    legendary-scroll-cores: 1
  maps:
    # Fixed destinations: six Overworld sanctuaries, or Bodiless Judge / Arkhaia / Seraphon.
    overworld-feathers: 30
    evergarden-golden-feathers: 10
    evergarden-search-radius: 12000
  # A new sale every few in-game days (Evergarden's game clock; 3 days = 1 real hour at 20 TPS):
  # random staff elements, plus one category that rotates scrolls -> potions -> Core of Legend.
  promotions:
    enabled: true
    period-days: 3
    staff-elements: 2
    staff-feathers-off: 30     # percent, shown struck through like a villager discount
    staff-orbs-off: 40
    other-off: 30              # daily scrolls
    potion-off: 50             # supreme mana potion
    legend-core-off: 20        # golden feathers for a Core of Legend
  # Per-player stock, like a villager that restocks: per day, or per ISO week.
  limits:
    staffs-per-week: 2
    scroll-basic-per-day: 2    # scrolls on offer today (same for everyone); 1 of each per day
    scroll-rare-per-day: 3
    scroll-epic-per-day: 2
    good-potions-per-day: 10
    supreme-potions-per-day: 2
    legendary-scrolls-on-offer: 2
    # The whole legend shop (Core of Legend, legendary weapons and scrolls, boss armor,
    # realm core sales and mythical eggs) shares one stock per player, reset every
    # in-game day (24000 ticks of Evergarden's game clock, about 20 minutes).
    legend-shop-per-day: 10
  # Matched by colour: fire red/orange, wind and earth green, ice and water blue,
  # lightning and dark purple, light gold.
  element-orbs:
    fire: [phlegethon, acheron]
    wind: [banshee]
    earth: [banshee]
    ice: [cocytus]
    water: [cocytus]
    lightning: [malefeasance]
    light: [styx]
    dark: [malefeasance]

# No anticheat bypass permissions are granted. Restart after changing modes.
compatibility:
  # Keep LevelledMobs active elsewhere, but automatically exclude the Evergarden world.
  levelled-mobs-exclude-world: true
  # Capped server-sent grapple/knockback. Set false to disable these player impulses.
  player-impulses: true
  max-impulse-horizontal: 1.2
  max-impulse-vertical: 1.0

# Six-wing guardian of Supreme Sanctuary.
seraphon:
  enabled: true
  # Solo health; each extra participant adds health-per-extra-player, never above health-cap.
  health: 7000.0
  health-per-extra-player: 1500.0
  health-cap: 10000.0
  # Scales every Seraphon attack (100 = the published tuning). Light pierces armor.
  damage-percent: 100
  # A wiped party restarts the current phase after 10 seconds; full reset after this grace.
  return-grace-seconds: 180

# Dimensional boss-arena sanctuaries (Nether: crown-fortress, bone-temple; End: crystal-city, void-ring).
dimensional-sanctuaries:
  enabled: true
  worlds: []
  region-blocks:
    crown-fortress: 2048
    bone-temple: 2048
    crystal-city: 3072
    void-ring: 3072
  habitat:
    suppress-natural-hostiles: true
  treasure:
    # Chance (0.0 to 1.0) that a rolled Netherite Upgrade Smithing Template in a Nether sanctuary
    # chest stays a template instead of converting to 1-2 Netherite Scrap. Set to 0.0 to disable completely.
    netherite-upgrade-chance: 0.05
  bosses:
    enabled: true
    empty-reset-seconds: 15
    respawn-ticks: 600
    damage-percent: 100
    # Each extra challenger adds this share of the boss's solo health, up to party-health-max x solo health
    # (3.8 = five players). The per-boss health-per-extra-player / health-cap keys are no longer read.
    party-health-percent: 70.0
    party-health-max: 3.8
    cinder-colossus:
      health: 3800.0
      health-per-extra-player: 950.0
      health-cap: 7600.0
      damage-percent: 100
    soul-hound:
      health: 3200.0
      health-per-extra-player: 850.0
      health-cap: 6600.0
      damage-percent: 100
    crystal-moth:
      health: 3400.0
      health-per-extra-player: 900.0
      health-cap: 7000.0
      damage-percent: 100
    unlit-sun:
      health: 3600.0
      health-per-extra-player: 950.0
      health-cap: 7400.0
      damage-percent: 100
