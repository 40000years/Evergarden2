# Allies: the caster, their tamed animals, and members of their main-scoreboard team.
pvp: true
elemental-visuals:
  enabled: true
  # Native Minecraft particles, Blaze/Ghast fireballs and vanilla 3D blocks.
  # authored restores the previous illustrated presentation for comparison.
  style: native
  # balanced: animated volumes and solids; low: fewer particles and solids.
  quality: balanced
  sounds: true
  # Cosmetic limits do not consume combat EffectEngine slots or change damage.
  max-scenes: 96
  max-native-particles-per-world-tick: 2400
  max-native-particles-per-viewer-tick: 360
  max-native-displays-per-world: 160
  max-native-projectiles-per-world: 48
  # Limits for the optional authored renderer.
  max-planes-per-world: 128
  bedrock-packets-per-viewer-tick: 12
  # The seven elemental Legendaries: vanilla particles per viewer per tick (low quality uses 160).
  legendary-particles-per-viewer-tick: 450
  # Wrath of Raijin calls cosmetic lightning bolts (no damage or fire); false removes them and their thunder.
  legendary-lightning-strikes: true
  # Heaven's Descent: a golden judgment beam cannon (the Ancient Judge's gold seals).
  # Applies in either style; false draws a plain beam instead. Size of seals and beam: 0.5..1.5.
  # The old light-rain keys (sky-height, duration-seconds, afterglow-ticks) are ignored.
  legendary-light:
    enabled: true
    scale: 1.0
elemental-system:
  staff-durability:
    # Each successful cast (and each Phoenix Rebirth trigger) uses one. Repair at a
    # Restoration Altar; each Wand Repair Core adds this many to the maximum (level 10 max).
    base-uses: 300
    uses-per-repair-core: 50
  stats:
    # Minecraft HP: Fireball base14.4; matching staff21.6; mismatched/wood7.2.
    spell-power: 12.0
    healing-power: 6.0
  skill-tree:
    # Arcane XP (separate from vanilla levels). Level L -> L+1 costs xp-base * xp-growth^(L-1);
    # every Arcane level is one skill point. Bosses still grant points directly.
    xp-base: 100
    xp-growth: 1.15
    max-level: 100
    # First opening of a structure chest (shared per chest, once).
    structure-chest-xp: 60
  mana:
    combat-regen: 3.0
    out-of-combat-regen: 7.0
    combat-duration-seconds: 10
    regen-delay-seconds: 2
    global-cooldown: 0.65
    ultimate-gcd: 1.2
    ultimate-category-seconds: 15
  scroll-loot:
    # One roll per NEW authored Evergarden chest; all eight elements share each rarity pool.
    exploration:
      chance: 0.25
      rarity-weights: {basic: 65, rare: 28, epic: 6, legendary: 1}
    landmark:
      chance: 0.40
      rarity-weights: {basic: 45, rare: 35, epic: 17, legendary: 3}
    boss:
      chance: 0.65
      rarity-weights: {basic: 25, rare: 35, epic: 30, legendary: 10}
    sanctuary:
      chance: 0.65
      rarity-weights: {basic: 25, rare: 35, epic: 30, legendary: 10}
elemental-combat:
  target-cap: 12
  # A single cast (including its DoT and reactions) can remove at most 5% boss HP.
  boss-damage-cap-percent: 5
  healing-per-cast-percent: 60
  healing-pulse-lock-ticks: 15
  phoenix-health-percent: 25
  summon-goal-range: 12
  # Heaven's Descent beam: firing seconds after the 1.2 s charge (3..10), reach in blocks
  # (16..64; it stops at solid blocks) and how fast it follows the caster's aim (30..360
  # degrees per second). The old pull-strength key is ignored.
  legendary-light:
    beam-seconds: 6
    beam-range: 48
    turn-degrees-per-second: 120
mana-potions:
  nausea-seconds: 30
  restore:
    low: 20
    medium: 35
    good: 50
    supreme: 100
max-active-effects: 128
max-targets-per-effect: 32
# Native staff models, now carrying an item-owned elemental spell loadout.
elemental-staffs:
  ambient-effects: true
mythic-terrain:
  # Restores ground that a retired Solar/Chronos cast left behind before a crash.
  radius: 16
  duration-seconds: 15
  chronos-ice-duration-seconds: 6
# Bundled pack is automatically offered one tick after joining.
flying-staff:
  enabled: true
  diagnostics:
    # One read-only Bedrock flight trace per player per restart, at most 120 seconds.
    # Stops 20 seconds after dismount; writes StaffTrace lines to the server log.
    enabled: true
  # Old default Turbo is the new normal speed; custom base speeds are kept.
  speed-version: 3
  horizontal-speed: 0.486
  vertical-speed: 0.288
  bedrock-controls:
    # Preserve controller stick magnitude before Geyser converts it to buttons.
    analog-deadzone: 0.15
    # Forward movement follows the camera smoothly above/below this level band.
    pitch-deadzone: 12.0
    pitch-full-speed: 60.0
  turbo-multiplier: 4.0
  mana-per-second: 2.0
  # Normal = 2 mana/sec; Turbo = 3 mana/sec with the default multiplier.
  turbo-mana-multiplier: 1.5
  anticheat:
    # Permission is granted only while riding and removed on dismount/quit.
    # Add other plugin permissions only after checking that plugin's documentation.
    bypass-permissions:
      GrimAC: [grim.disabled]
      NoCheatPlus: [nocheatplus.checks.moving.vehicle]
resource-pack:
  enabled: true
  # Empty URL/SHA-1 serves the exact pack embedded in this plugin. Set both for
  # your own CDN; administrator-owned external URLs are preserved on upgrades.
  url: ''
  sha1: ''
  # Resource packs are optional. Players can still join if loading fails.
  required: false
  # Warn after this many seconds if a Java pack is still loading; players are not kicked.
  required-timeout-seconds: 600
  # Public copies of the packs, named by a fingerprint of their contents. At startup the
  # server downloads each copy once and offers it only if it holds exactly the same files;
  # players then fetch it there first, with this server's own host as the fallback.
  # Outbound HTTPS is enough, so this works on hosts that expose only the game port.
  # [] = serve the packs only from this server.
  mirrors:
  - https://raw.githubusercontent.com/40000years/Evergarden2/packs/{pack}/{fingerprint}.zip
  host:
    enabled: true
    # Serve the pack through the Minecraft port itself, so hosting panels need
    # no extra port. false = listen on the separate port below instead.
    use-server-port: true
    bind: '0.0.0.0'
    # Must be reachable by Java clients when use-server-port is false.
    port: 8187
    # Empty = hostname the player joined. Set explicitly for proxies/SRV records.
    public-host: ''
    # Optional HTTP(S) reverse-proxy base URL for the separate port (also turns
    # off use-server-port). The pack path is appended.
    public-url: ''
  geyser:
    # Copies Advance Magic's own files during onLoad, before Geyser starts.
    auto-install: true

legendary-weapons:
  enabled: true
  # A short authored circle appears once when equipping a legendary weapon.
  equip-sigil: true
  # Holder-only equip resonance and a quiet chime every 12 seconds.
  sounds: true
  volume: 0.45
  combat:
    enabled: true
    # Durations and cooldowns below are seconds; damage uses Minecraft HP (2 HP = 1 heart).
    pulse-seconds: 1
    excalibur:
      damage: 50
      charge-seconds: 3
      skill-damage: 100
      range: 16
      wave-width: 3
      cooldown-seconds: 180
    tyrfing:
      damage: 35
      max-damage: 60
      per-hit: 5
      decay-delay-seconds: 10
      decay-per-second: 5
      duration-seconds: 10
      radius: 3
      cooldown-seconds: 180
    longinus:
      damage: 20
      max-damage: 30
      slow-seconds: 3
      skill-damage: 10
      cast-range: 16
      radius: 8
      duration-seconds: 10
      cooldown-seconds: 180
    mjolnir:
      damage: 15
      smash-multiplier: 4
      skill-damage: 10
      radius: 8
      duration-seconds: 30
      cooldown-seconds: 180
    vajra:
      damage: 30
      root-seconds: 3
      root-cooldown-seconds: 120
      skill-damage: 50
      radius: 8
      cooldown-seconds: 180

compatibility:
  # false: player roots use Slowness V; mobs retain the full root.
  # true: also force player positions/velocity; test with your anticheat first.
  hard-player-roots: false
  # Server-sent, capped knockback/pull. Set false for strict servers (damage is unchanged).
  player-spell-velocity: true
  max-player-horizontal-velocity: 1.1
  max-player-vertical-velocity: 0.9
