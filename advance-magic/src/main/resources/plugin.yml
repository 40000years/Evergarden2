name: advance-magic
version: 1.3.0-mythic-wands
main: com.example.advancemagic.AdvanceMagicPlugin
api-version: '26.2'
description: Seventeen spells including three Mythic wands, mana and crafting.
softdepend: [floodgate, GrimAC]
loadbefore: [Geyser-Spigot]
commands:
  magic:
    description: List spells, craft wands or open the admin item menu.
    usage: /magic [list|mana|craft|items|pack [resend]|givestaff [player]|turbo|give <player> <spell>]
permissions:
  advance-magic.cast:
    default: true
  advance-magic.craft:
    default: true
  advance-magic.flying-staff:
    default: true
  advance-magic.admin:
    default: op
